<svg xmlns="http://www.w3.org/2000/svg" width="120" height="300" viewBox="0 0 120 300">
  <!-- Remote control outline -->
  <rect x="8" y="8" width="104" height="284" rx="28" fill="#1E1E1E" stroke="#333333" stroke-width="2"/>
  <rect x="8" y="8" width="104" height="284" rx="28" fill="#272727"/>
  <!-- Power button -->
  <circle cx="60" cy="42" r="14" fill="#323232" stroke="#444444" stroke-width="1.5"/>
  <path d="M60 32 L60 42" stroke="#BB86FC" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 36 Q44 42 44 50 Q44 62 60 62 Q76 62 76 50 Q76 42 70 36"
        fill="none" stroke="#BB86FC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- D-pad circle -->
  <circle cx="60" cy="110" r="28" fill="#323232" stroke="#444444" stroke-width="1.5"/>
  <!-- D-pad arrows -->
  <polygon points="60,88 53,100 67,100" fill="#BBBBBB"/>
  <polygon points="60,132 53,120 67,120" fill="#BBBBBB"/>
  <polygon points="38,110 50,103 50,117" fill="#BBBBBB"/>
  <polygon points="82,110 70,103 70,117" fill="#BBBBBB"/>
  <!-- OK button center -->
  <circle cx="60" cy="110" r="13" fill="#272727" stroke="#555555" stroke-width="1"/>
  <text x="60" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#BB86FC" text-anchor="middle">OK</text>
  <!-- Color buttons -->
  <circle cx="32" cy="200" r="10" fill="#CF6679"/>
  <circle cx="52" cy="218" r="10" fill="#03DAC6"/>
  <circle cx="68" cy="218" r="10" fill="#FDD835"/>
  <circle cx="88" cy="200" r="10" fill="#BB86FC"/>
  <!-- Menu / info row -->
  <rect x="22" y="163" width="30" height="18" rx="5" fill="#323232" stroke="#444444" stroke-width="1"/>
  <rect x="68" y="163" width="30" height="18" rx="5" fill="#323232" stroke="#444444" stroke-width="1"/>
  <text x="37" y="176" font-family="sans-serif" font-size="8" fill="#BBBBBB" text-anchor="middle">MENU</text>
  <text x="83" y="176" font-family="sans-serif" font-size="8" fill="#BBBBBB" text-anchor="middle">INFO</text>
  <!-- Numeric row hint -->
  <rect x="22" y="244" width="22" height="16" rx="4" fill="#323232"/>
  <rect x="49" y="244" width="22" height="16" rx="4" fill="#323232"/>
  <rect x="76" y="244" width="22" height="16" rx="4" fill="#323232"/>
  <rect x="22" y="264" width="22" height="16" rx="4" fill="#323232"/>
  <rect x="49" y="264" width="22" height="16" rx="4" fill="#323232"/>
  <rect x="76" y="264" width="22" height="16" rx="4" fill="#323232"/>
</svg>
