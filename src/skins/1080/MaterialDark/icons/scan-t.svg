<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Terrestrial antenna -->
  <!-- Mast -->
  <line x1="48" y1="34" x2="48" y2="82" stroke="#FDD835" stroke-width="4" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="26" y1="34" x2="70" y2="34" stroke="#FDD835" stroke-width="4" stroke-linecap="round"/>
  <!-- Dipole elements (angled) -->
  <line x1="36" y1="34" x2="18" y2="58" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="34" x2="78" y2="58" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
  <!-- Second set of elements (shorter) -->
